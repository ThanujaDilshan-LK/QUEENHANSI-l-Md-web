<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEENHANSI-MD | Pair Code</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <!-- Logo / Title -->
        <div class="header">
            <img src="https://github.com/fluidicon.png" alt="Logo" class="logo">
            <h1>QUEENHANSI-MD</h1>
            <p>Enter your WhatsApp number to get the Pair Code</p>
        </div>

        <!-- Input Section -->
        <div class="card">
            <div class="input-group">
                <span class="icon"><i class="fa-brands fa-whatsapp"></i></span>
                <input type="text" id="phoneNumber" placeholder="Example: 94741933159" autocomplete="off">
            </div>
            
            <button class="submit-btn" onclick="getPairCode()" id="submitBtn">
                GET PAIR CODE
            </button>

            <!-- Loading Spinner -->
            <div class="loading" id="loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Generating your code...
            </div>

            <!-- Result Display -->
            <div class="result-container" id="resultContainer">
                <p class="instruction">Your Pair Code is ready!</p>
                <div class="code-box">
                    <span id="pairCodeDisplay">----</span>
                    <button class="copy-btn" onclick="copyCode()"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Developed by <span>QUEENHANSI-MD</span> &copy; 2026</p>
            <div class="social-links">
                <button onclick="buyBot()" class="buy-link"><i class="fa-solid fa-cart-shopping"></i> Buy Bot Script</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
